<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a"><title>PronoX · Picks en vivo</title>
<style>
:root{--bg:#0b0f1a;--c1:#141a2b;--c2:#1c2438;--bd:#27314a;--tx:#eef2ff;--mu:#8b97b5;--ac:#b8ff3d;--pu:#7c5cff;--rd:#ff5470;--gr:#2ee59d;--am:#ffb020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:rgba(11,15,26,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--ac)}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--c2);color:var(--mu)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rd);margin-right:5px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--c1);border:1px solid var(--bd);color:var(--tx);font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#0b0f1a;border-color:var(--ac);font-weight:700}
.thr{display:flex;align-items:center;gap:10px;padding:6px 0 0;font-size:12px;color:var(--mu)}
.thr input{flex:1;accent-color:var(--ac)}.thr b{color:var(--ac);font-size:16px;min-width:42px;text-align:right}
main{padding:10px 14px;max-width:760px;margin:0 auto}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0}
.card.live{border-color:var(--rd);box-shadow:0 0 0 1px rgba(255,84,112,.3)}
.top{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px}
.tm{display:flex;align-items:center;gap:10px;margin:5px 0}.tm img{width:26px;height:26px;object-fit:contain}.tm .n{flex:1;font-weight:600}.tm small{color:var(--mu);font-weight:400;margin-left:6px}
.tm .s{font-size:20px;font-weight:800;min-width:26px;text-align:right}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:10px 0 4px;background:var(--c2)}
.bar i{display:block;height:100%}.b1{background:var(--ac)}.bx{background:var(--mu)}.b2{background:var(--pu)}
.bl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pk{background:var(--c2);border:1px solid var(--bd);border-radius:10px;padding:6px 9px;font-size:12px}.pk b{color:var(--ac);margin-left:4px}
.pk.win{border-color:var(--gr)}.pk.lose{border-color:var(--rd);opacity:.7}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}td,th{padding:5px 3px;text-align:left;border-bottom:1px solid var(--bd)}td:nth-child(n+2),th:nth-child(n+2){text-align:right}.hi{color:var(--ac);font-weight:700}
.tk h3{margin:0 0 2px;font-size:16px}.tk .ring{--p:50;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--c2) 0);display:grid;place-items:center;flex:none}
.tk .ring span{width:50px;height:50px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font-weight:800;font-size:13px}
.leg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:13px}.leg small{color:var(--mu);display:block}
.kpi{display:flex;gap:8px;margin-top:10px}.kpi div{flex:1;background:var(--c2);border-radius:10px;padding:8px;text-align:center}.kpi b{display:block;font-size:17px;color:var(--ac)}.kpi small{color:var(--mu);font-size:11px}
.dream .kpi b{color:var(--am)}.dream .ring{background:conic-gradient(var(--am) calc(var(--p)*1%),var(--c2) 0)}
input.st{width:90px;background:var(--c2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:5px 8px;font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(20,26,43,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 2px;font:inherit;font-size:11px;cursor:pointer}nav button span{display:block;font-size:19px}nav button.on{color:var(--ac)}
.mu{color:var(--mu);font-size:12px}.err{background:#3a1620;border:1px solid var(--rd);border-radius:12px;padding:10px;margin:10px 0}
h2{font-size:15px;margin:16px 0 4px}.big{font-size:26px;font-weight:900;color:var(--ac)}
.dp{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}.dp h4{margin:10px 0 4px;font-size:13px}.q{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--c2)}.deepbtn{margin-top:10px;border-color:var(--pu)}.l2{font-size:12px;color:var(--mu);margin:2px 0}</style></head><body>
<header>
 <div class="row"><div class="logo">Prono<b>X</b></div><div class="sp"></div><span class="pill" id="upd">cargando…</span></div>
 <div class="chips" id="sports"></div>
 <div class="row" style="padding-top:6px"><button class="chip" id="pv">‹</button><span id="dt" style="flex:1;text-align:center;font-weight:600"></span><button class="chip" id="nx">›</button></div>
 <div class="thr">Probabilidad mínima<input type="range" id="thr" min="50" max="95" value="70"><b id="tv">70%</b></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),ICON={soccer:'⚽',nba:'🏀',mlb:'⚾',nfl:'🏈',nhl:'🏒'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={sport:'all',date:iso(new Date()),thr:70,tab:'hoy',ev:[],open:{},upd:0,err:'',stake:{},deep:{}};
const SP=[['all','Todos'],['soccer','⚽ Fútbol'],['nba','🏀 NBA'],['mlb','⚾ MLB'],['nfl','🏈 NFL'],['nhl','🏒 NHL']];
const TABS=[['hoy','📅','Hoy'],['vivo','🔴','En vivo'],['comb','🎯','Combinadas'],['sue','🌙','Soñadoras']];
function chrome(){
 $('#sports').innerHTML=SP.map(s=>`<button class="chip ${S.sport==s[0]?'on':''}" data-s="${s[0]}">${s[1]}</button>`).join('');
 $('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab==t[0]?'on':''}" data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 $('#dt').textContent=new Date(S.date+'T12:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'});
}
$('#sports').onclick=e=>{const s=e.target.dataset.s;if(s){S.sport=s;chrome();load()}};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;chrome();body();scrollTo(0,0)}};
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);
function shift(n){const d=new Date(S.date+'T12:00');d.setDate(d.getDate()+n);S.date=iso(d);chrome();load()}
$('#thr').oninput=e=>{S.thr=+e.target.value;$('#tv').textContent=S.thr+'%';body()};
async function load(){
 try{const r=await fetch(`/api/events?sport=${S.sport}&date=${S.date}`);const j=await r.json();if(j.error)throw new Error(j.error);S.ev=j.events;S.upd=Date.now();S.err=''}
 catch(e){S.err=e.message}
 body()}
setInterval(()=>{if(S.date==iso(new Date()))load()},30000);
setInterval(()=>{$('#upd').textContent=S.upd?'actualizado hace '+Math.round((Date.now()-S.upd)/1e3)+' s':'cargando…'},1000);

const thr=()=>S.thr/100,pc=p=>Math.round(p*100)+'%';
const fair=p=>(1/p).toFixed(2);
const time=e=>new Date(e.start).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const cands=e=>e.markets.slice().sort((a,b)=>b.p-a.p);
// estado de un pick con el marcador actual: win/lose/ok/bad/wait/push
function status(k,e){
 const h=e.home.score,a=e.away.score;if(e.state=='pre'||h==null||a==null)return 'wait';
 const fin=e.state=='post',t=h+a,x=k.match(/^([OU])(\d\.\d)$/);
 const R=(cond,settledWin)=>fin?(cond?'win':'lose'):(cond?'ok':'bad');
 if(x){const L=+x[2];if(x[1]=='O')return t>L?'win':(fin?'lose':'ok');return t>L?'lose':(fin?'win':'ok')}
 if(k=='BY')return h&&a?'win':(fin?'lose':'wait');
 if(k=='BN')return h&&a?'lose':(fin?'win':'ok');
 if(k=='1')return R(h>a);if(k=='2')return R(a>h);if(k=='X')return R(h==a);
 if(k=='1X')return R(h>=a);if(k=='X2')return R(a>=h);if(k=='12')return R(h!=a);
 if(k=='DNB1')return h==a?'push':R(h>a);if(k=='DNB2')return h==a?'push':R(a>h);return 'wait'}
const SI={win:'✅',lose:'❌',ok:'🟢',bad:'🔴',wait:'',push:'↔️'};
function card(e){
 const live=e.state=='in',fin=e.state=='post',p=e.probs;
 const top=cands(e).filter(m=>m.p>=thr()).slice(0,3);
 const bar=e.sport=='soccer'?`<i class="b1" style="width:${p.h*100}%"></i><i class="bx" style="width:${p.d*100}%"></i><i class="b2" style="width:${p.a*100}%"></i>`:`<i class="b1" style="width:${p.h*100}%"></i><i class="b2" style="width:${p.a*100}%"></i>`;
 const lab=e.sport=='soccer'?`<span>${pc(p.h)}</span><span>Empate ${pc(p.d)}</span><span>${pc(p.a)}</span>`:`<span>${pc(p.h)}</span><span>${pc(p.a)}</span>`;
 const row=(t,l)=>`<div class="tm"><img src="${esc(t.logo)}" alt="" onerror="this.style.visibility='hidden'"><span class="n">${esc(t.name)}<small>${esc(t.record)}</small></span><span class="s">${e.state=='pre'?'':(t.score==null?'':t.score)}</span></div>`;
 const open=S.open[e.id];
 const tbl=open?`<table><tr><th>Mercado</th><th>Prob.</th><th>Cuota justa</th><th>Cuota casa</th></tr>${cands(e).map(m=>`<tr><td>${esc(m.n)} ${SI[status(m.k,e)]}</td><td class="${m.p>=thr()?'hi':''}">${pc(m.p)}</td><td>${fair(m.p)}</td><td>${m.odds||'–'}</td></tr>`).join('')}</table><div class="mu" style="margin-top:6px">Base: ${e.probSource=='mercado'?'momios de '+esc(e.book||'mercado')+' sin margen':'récords de temporada (sin momios)'}${e.venue?' · '+esc(e.venue):''}</div>${e.sport=='soccer'?deepPanel(e):''}`:'';
 return `<div class="card ${live?'live':''}" data-id="${e.id}"><div class="top"><span>${ICON[e.sport]} ${esc(e.league)}</span><span>${live?'<i class="dot"></i>'+esc(e.detail):fin?'Final':time(e)}</span></div>${row(e.home)}${row(e.away)}<div class="bar">${bar}</div><div class="bl">${lab}</div><div class="picks">${top.length?top.map(m=>`<span class="pk ${status(m.k,e)=='win'?'win':status(m.k,e)=='lose'?'lose':''}">${SI[status(m.k,e)]} ${esc(m.n)}<b>${pc(m.p)}</b></span>`).join(''):'<span class="mu">Sin picks sobre '+S.thr+'%</span>'}</div>${tbl}</div>`}

function deepPanel(e){
 const d=S.deep[e.id],btn=l=>`<button class="chip deepbtn" data-deep="${e.id}">${l}</button>`;
 if(!d)return btn('🔬 Análisis a fondo');
 if(d.loading)return '<div class="dp mu">Analizando forma, bajas, descanso, H2H y clima…</div>';
 if(d.error)return `<div class="dp"><div class="err">${esc(d.error)}</div>${btn('Reintentar')}</div>`;
 const I=d.inputs,H=I.home,A=I.away,own=Object.fromEntries(e.markets.map(m=>[m.k,m.p]));
 const r=(n,a,b)=>`<tr><td>${n}</td><td>${a}</td><td>${b}</td></tr>`,f=x=>(+x).toFixed(1);
 const rows=d.markets.filter(m=>m.k!='CS').map(m=>({n:m.n,a:m.p,b:own[m.k],c:own[m.k]!=null?(m.p+own[m.k])/2:m.p})).sort((x,y)=>y.c-x.c);
 const w=d.weather;
 return `<div class="dp"><div class="row"><b>🔬 Análisis a fondo</b><span class="sp"></span><span class="q">datos ${d.quality}%</span></div>
 <div class="l2">Goles esperados: ${esc(d.fixture.home)} ${d.lambdas.home} · ${esc(d.fixture.away)} ${d.lambdas.away}</div>
 <table><tr><th>Factor</th><th>Local</th><th>Visita</th></tr>${r('Goles a favor',f(H.xg),f(A.xg))}${r('Goles en contra',f(H.xga),f(A.xga))}${r('Forma (pts de 18)',f(H.form),f(A.form))}${r('Impacto de bajas (0-10)',f(H.abs),f(A.abs))}${r('Días de descanso',H.rest,A.rest)}${r('Motivación (1-5)',H.mot,A.mot)}</table>
 ${d.injuries.home.length||d.injuries.away.length?`<h4>Bajas</h4><div class="l2">${esc(d.fixture.home)}: ${d.injuries.home.map(esc).join(', ')||'ninguna reportada'}</div><div class="l2">${esc(d.fixture.away)}: ${d.injuries.away.map(esc).join(', ')||'ninguna reportada'}</div>`:''}
 ${w?`<h4>Clima</h4><div class="l2">${f(w.temp)} °C · lluvia ${w.rain} mm · viento ${f(w.wind)} km/h ${w.tags.length?'→ '+w.tags.join(', '):''}</div>`:''}
 ${d.h2h?`<h4>Historial directo</h4><div class="l2">Últimos ${d.h2h.n}: ${d.h2h.hw} del local, ${d.h2h.d} empates, ${d.h2h.aw} de la visita · ${d.h2h.avgGoals} goles por partido</div>`:''}
 ${d.apiPrediction?`<h4>Predicción de API-Football</h4><div class="l2">${esc(d.apiPrediction.advice||'')} · ${esc(JSON.stringify(d.apiPrediction.percent||{}).replace(/[{}"]/g,'').replace(/,/g,' · '))}</div>`:''}
 <h4>Mercados: a fondo, mercado y promedio</h4><table><tr><th>Mercado</th><th>A fondo</th><th>Mercado</th><th>Promedio</th></tr>${rows.map(x=>`<tr><td>${esc(x.n)}</td><td>${pc(x.a)}</td><td>${x.b!=null?pc(x.b):'–'}</td><td class="${x.c>=thr()?'hi':''}">${pc(x.c)}</td></tr>`).join('')}</table>
 ${d.missing.length?`<div class="mu" style="margin-top:6px">Sin dato (valor neutral): ${esc(d.missing.join(', '))}</div>`:''}</div>`}
async function runDeep(id){
 const e=S.ev.find(x=>x.id==id);if(!e)return;S.deep[id]={loading:1};body();
 try{const r=await fetch(`/api/deep?home=${encodeURIComponent(e.home.name)}&away=${encodeURIComponent(e.away.name)}&start=${encodeURIComponent(e.start)}`);const j=await r.json();S.deep[id]=j.error?{error:j.error}:j}
 catch(x){S.deep[id]={error:x.message}}
 body()}
$('#app').onclick=e=>{const b=e.target.closest('[data-deep]');if(b){runDeep(b.dataset.deep);return}const c=e.target.closest('.card[data-id]');if(c&&!e.target.closest('input')){S.open[c.dataset.id]=!S.open[c.dataset.id];body()}};

// legs: un solo pick por partido (evita correlación dentro del mismo partido)
function legs(min,max){return S.ev.filter(e=>e.state=='pre').map(e=>{const m=cands(e).find(m=>m.p>=min&&m.p<=max);return m?{e,m}:null}).filter(Boolean).sort((a,b)=>b.m.p-a.m.p)}
function ticket(name,sub,L,dream,id){
 if(!L.length)return `<div class="card"><b>${name}</b><div class="mu">No hay suficientes partidos con picks en este rango. Cambia el filtro o el día.</div></div>`;
 const P=L.reduce((a,l)=>a*l.m.p,1),real=L.every(l=>l.m.odds)?L.reduce((a,l)=>a*l.m.odds,1):null;
 const st=S.stake[id]||100,cu=real||1/P;
 return `<div class="card tk ${dream?'dream':''}"><div class="row"><div class="sp"><h3>${name}</h3><div class="mu">${sub}</div></div><div class="ring" style="--p:${Math.min(100,P*100)}"><span>${P>=.1?pc(P):(P*100).toFixed(1)+'%'}</span></div></div>
 ${L.map(l=>`<div class="leg"><div>${ICON[l.e.sport]} ${esc(l.m.n)}<small>${esc(l.e.home.name)} vs ${esc(l.e.away.name)} · ${time(l.e)}</small></div><b style="color:var(--ac)">${pc(l.m.p)}</b></div>`).join('')}
 <div class="kpi"><div><b>${fair(P)}</b><small>cuota justa</small></div><div><b>${real?real.toFixed(2):'–'}</b><small>cuota casa</small></div><div><b>1 de ${Math.round(1/P)}</b><small>veces acierta</small></div></div>
 <div class="row" style="margin-top:10px"><span class="mu">Apuesta $</span><input class="st" type="number" min="0" value="${st}" data-id="${id}"><span class="mu sp" style="text-align:right">Pagaría ≈ $<b style="color:var(--ac)">${(st*cu).toFixed(0)}</b>${real?'':' (justa)'}</span></div></div>`}
document.addEventListener('input',e=>{if(e.target.classList.contains('st')){S.stake[e.target.dataset.id]=+e.target.value||0;const t=e.target.closest('.tk');const b=t&&t.querySelector('.row:last-child b');if(b){/* recalcular */const k=t.querySelectorAll('.kpi b');const c=parseFloat(k[1].textContent)||parseFloat(k[0].textContent);b.textContent=((+e.target.value||0)*c).toFixed(0)}}});

function body(){
 const A=$('#app');let h='';
 if(S.err)h+=`<div class="err">No se pudieron cargar los datos: ${esc(S.err)}</div>`;
 if(S.tab=='hoy'){
  if(!S.ev.length&&!S.err)h+='<div class="mu" style="padding:30px 0;text-align:center">No hay partidos para este día y deporte.</div>';
  h+=S.ev.map(card).join('')}
 if(S.tab=='vivo'){
  const lv=S.ev.filter(e=>e.state=='in'),fn=S.ev.filter(e=>e.state=='post');
  let w=0,t=0;fn.forEach(e=>cands(e).filter(m=>m.p>=thr()).forEach(m=>{const s=status(m.k,e);if(s=='win'){w++;t++}else if(s=='lose')t++}));
  h+=`<h2>En vivo ahora (${lv.length})</h2>`+(lv.length?lv.map(card).join(''):'<div class="mu">No hay partidos en vivo ahora. Se actualiza solo cada 30 s.</div>');
  h+=`<h2>Finalizados hoy</h2><div class="card"><div class="mu">Acierto de los picks sobre ${S.thr}% en partidos ya terminados</div><div class="big">${t?w+' / '+t+' · '+Math.round(w/t*100)+'%':'–'}</div></div>`+fn.map(card).join('')}
 if(S.tab=='comb'){
  const L=legs(thr(),.99);
  h+=`<h2>Combinadas con picks de ${S.thr}% o más</h2><div class="mu">Solo partidos que aún no empiezan, un pick por partido.</div>`;
  h+=ticket('Dúo','2 picks más probables',L.slice(0,2),0,'c2')+ticket('Trío','3 picks más probables',L.slice(0,3),0,'c3')+ticket('Cuarteto','4 picks más probables',L.slice(0,4),0,'c4')}
 if(S.tab=='sue'){
  const L=legs(.45,.99);
  h+=`<h2>Soñadoras</h2><div class="mu">Muchas selecciones, poca probabilidad y pago grande. Es entretenimiento: lo normal es perder.</div>`;
  h+=ticket('Soñadora 5','5 picks, pago medio',L.slice(0,5),1,'s5')+ticket('Soñadora 7','7 picks, pago alto',L.slice(0,7),1,'s7')+ticket('Gran sueño 10','10 picks, pago enorme',L.slice(0,10),1,'s10')}
 h+='<p class="mu" style="margin-top:20px">+18. Las probabilidades son estimaciones a partir de momios y récords; no garantizan resultados. Si ya no es divertido, pide ayuda: juego responsable. Datos: ESPN (no oficial).</p>';
 A.innerHTML=h}
chrome();load();
</script></body></html>
